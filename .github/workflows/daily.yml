name: Daily 메르 블로그 업데이트

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 오전 7시 KST (UTC 22:00)
  workflow_dispatch:       # 수동 실행도 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install openai aiofiles

      - name: 새 글 수집 및 처리
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # new_posts.log 없으면 최초 실행 → 4월 6일 이후 백필
          if [ ! -f new_posts.log ]; then
            echo "최초 실행: 2025-04-06 이후 백필 시작"
            python crawl_new.py --backfill 2025-04-06
          else
            python crawl_new.py
          fi

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed/ output/ new_posts.log
          git diff --staged --quiet || git commit -m "chore: 메르 블로그 자동 업데이트 $(date '+%Y-%m-%d')"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v4

      - name: output/ 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
