.section { margin-bottom: 24px; }

o28/223790383044"}, {"title": "트럼프가 원하는 &#x27;관세 맹주&#x27;, 베센트의 포부", "date": "2025-03-09", "folder": "미국·글로벌", "tags": ["#트럼프", "#베센트", "#관세", "#금리"], "intro": "25년 3월 9일 기준, 베센트 재무 장관은 CNBC 인터뷰를 통해 트럼프 행정부의 경제 방향과 관세 정책에 대해 언급했다. 그에 따르면 주가보다 금리가 더 중요하며, 트럼프의 관세정책은 단기적인 조정이 아니라 지속될 것이라는 입장을 밝혔다.", "question": "트럼프의 지속적인 관세 압박이 미국 경제 및 글로벌 무역에 미칠 영향은 무엇일까?", "answer": "트럼프의 관세 정책은 국제 무역의 흐름을 크게 바꿀 수 있다. 이는 특히 동맹국과의 관계에서 긴장 요소가 될 수 있다.", "link": "https://blog.naver.com/ranto28/223789414923"}, {"title": "엔화 강세, 과연 일본의 인플레이션에 맞설 수 있을까", "date": "2025-03-08", "folder": "금융·통화", "tags": ["#엔화", "#일본은행", "#금리", "#인플레이션"], "intro": "25년 3월 8일 현재 일본국채 30년물 금리가 2.5%에 도달하면서 엔화 강세가 논의되고 있다. 그러나 이 과정에서 일본 경제의 인플레이션 압력과 금리 인상 여부가 중요하게 작용할 것이다.", "question": "일본이 인플레이션을 통제하기 위해 금리를 인상하게 된다면, 엔화 강세가 지속될 수 있을까?", "answer": "일본은행의 금리 인상은 불가피하며, 이는 엔화 강세로 이어질 가능성이 크다. 그러나 인플레이션과 재정 압박이 동시에 작용하는 한, 금융 정책의 속도 조절이 관건이다.", "link": "https://blog.naver.com/ranto28/223788111880"}, {"title": "중국 양회의 경제 부양과 구리 수요 상승 — 철광석과 확연히 다르다", "date": "2025-03-07", "folder": "에너지·자원", "tags": ["#중국양회", "#경제부양", "#구리", "#철광석"], "intro": "2025년 3월 4일, 중국 양회가 시작되었다. 이번 회의는 경제 성장에 대한 구체적인 방향과 정책을 제시하며, 주목할 필요가 있다.", "question": "중국의 양회에서 제시된 경제 부양책이 구리 소비를 늘릴 수 있지만, 철강 시장에는 어떤 돌발 상황이 올 수 있을까?", "answer": "철강 시장은 부동산 경기와 밀접하게 연관되어 있으며, 그 악화가 지속된다면 철강 재고가 늘어날 수 있다. 이는 가격 하락과 수익 감소로 이어질 가능성이 크다.", "link": "https://blog.naver.com/ranto28/223785427489"}, {"title": "트럼프, 한국에 4배 높은 관세 발언과 알래스카 천연가스 개발 계획 언급", "date": "2025-03-06", "folder": "미국·글로벌", "tags": ["#트럼프", "#천연가스", "#관세", "#한미FTA"], "intro": "2025년 3월 6일, 트럼프 대통령은 의회에서 한국과 관련된 알래스카 가스관 개발과 관세 문제를 동시에 언급했다. 알래스카 가스관 사업은 한국과 일본이 직접적으로 참여할 가능성을 열어두고 있으며, 관세 문제는 한국과의 무역 관계에 긴장을 조성할 여지가 크다.", "question": "한국은 알래스카 가스관 사업에 참여할 수 있을까, 그럼으로써 미국과의 관계는 어떻게 변화할까?", "answer": "한국은 알래스카 가스관 사업에서 협력할 가능성이 크다. 이로 인해 미국과의 무역 관계가 강화될 수 있으나, 관세 문제는 여전히 해결해야 할 과제가 남아 있다.", "link": "https://blog.naver.com/ranto28/223784816464"}, {"title": "새마을금고, 이제는 비상등이 켜졌다고 할 수 있을까?", "date": "2025-03-05", "folder": "미국·글로벌", "tags": ["#새마을금고", "#부동산PF", "#금융", "#경제"], "intro": "2025년 3월 현재, 새마을금고가 직면한 재정적 어려움은 눈에 띄게 악화되고 있다. 특히 부동산 PF 대출의 위험성이 커지면서 이들이 적자 전환에 직면할 뿐만 아니라, 미분양 아파트의 증가로 인해 시장 신뢰도에 큰 타격이 우려된다.", "question": "새마을금고가 현재의 리스크를 극복하지 못한다면, 향후 금융시장에서 어떤 결과를 초래할 수 있을까?", "answer": "위험을 간과하고 현재의 문제를 해결하지 않는다면, 새마을금고는 더욱 큰 재정적 위기에 직면할 것이다. 이는 다른 금융 기관과 시장 신뢰도에 악영향을 미칠 수 있다.", "link": "https://blog.naver.com/ranto28/223783302577"}, {"title": "트럼프 재무부장관이 알려주는 미국국채 10년물 금리의 비밀", "date": "2025-03-04", "folder": "금융·통화", "tags": ["#미국국채", "#트럼프", "#SLR규제", "#금리전략"], "intro": "25년 3월 기준, 미국국채 10년물 금리를 낮추는 목표가 트럼프 정부의 주요 관심사로 떠올랐다. SLR 규제를 통해 금융기관의 국채 매입을 촉진하고 동시에 외교 수단으로 국채 수요를 증가시키겠다는 전략이 포착된다.", "question": "트럼프 정부의 국채 금리 조정 전략이 미국 금융 시스템에 미칠 잠재적 영향은 무엇일까?", "answer": "트럼프의 국채 금리 조정 전략은 금융기관의 유동성 문제를 악화시킬 수 있다. 규제로 인해 과도한 자산을 보유한 은행들이 계속해서 위험에 처할 가능성이 크다.", "link": "https://blog.naver.com/ranto28/223782075275"}, {"title": "항구마다 최대 500만달러 누적 — 중국선사 미국 항로는 구조적 적자", "date": "2025-03-03", "folder": "중후장대", "tags": ["#USTR선박수수료", "#중국선박입항료", "#HMM", "#컨테이너선", "#중국조선보조금", "#한국수혜"], "intro": "25년 3월, 2월 21일 USTR 보고서에 대한 보충 분석. 수수료가 미국 전체가 아니라 미국 &#x27;항구&#x27;마다 부과된다는 점, 중국선사·중국산선박·발주잔량·비중에 따라 수수료가 누적된다는 점 두 가지가 핵심이다. 이를 적용하면 중국선사의 미국 항로는 구조적으로 적자가 될 수밖에 없다.", "question": "USTR 중국선박 수수료 조치가 예정대로 확정·시행되면 한국 조선·해운이 실질적 수혜를 얻는가?", "answer": "수혜가 온다. 중국선사 기준 항구당 최대 500만달러 누적 수수료는 미국 항로 자체를 적자로 만들기 때문에 선사들이 신규 발주를 한국으로 돌릴 유인이 명확하다. HMM은 10대 선사 중 사실상 유일하게 수수료 영향권 밖에 있어 미국 항로 경쟁력이 상대적으로 올라간다.", "link": "https://blog.naver.com/ranto28/223780835433"}, {"title": "한국카본에 투자했다가 화재로 Exit한 이유는?", "date": "2025-03-01", "folder": "에너지·자원", "tags": ["#투자", "#주식", "#LNG", "#한국카본"], "intro": "25년 3월 기준, 한국카본은 LNG 운반선 보냉제 제작 회사를 둔 기업으로, 최근 화재로 인해 큰 위기를 맞았다. 기존 투자에서 Exit을 결단한 이유는 화재 후 공장 정상화에 긴 시간이 필요할 것으로 판단되었기 때문이다.", "question": "예상하지 못한 변수에 대처하지 못하면 투자 성과에 어떤 영향을 미칠까?", "answer": "결정적으로 변수에 대한 선제적 대응이 없었다면 장기적인 주가 상승을 놓치는 경우가 발생할 수 있다. 따라서, 시장 변화에 민감하게 반응할 필요가 있다.", "link": "https://blog.naver.com/ranto28/223778178736"}, {"title": "다이소, 건강기능식품으로 일본 돈 키호테의 성공을 재현할 수 있을까", "date": "2025-02-27", "folder": "미국·글로벌", "tags": ["#다이소", "#건강기능식품", "#돈키호테", "#대웅제약"], "intro": "25년 2월 기준, 다이소가 건강기능식품을 판매하기 시작하면서 일본 돈 키호테의 성공 사례와 비교되고 있다. 온라인 쇼핑의 비중이 높아짐에 따라 최저가 경쟁이 심화되고 있으며, 이는 유통업계에 큰 변화를 예고하고 있다.", "question": "다이소가 일본 돈 키호테처럼 성공적인 건강기능식품 판매업체로 자리 잡을 수 있을까?", "answer": "그 가능성은 높다. 다이소가 건강기능식품의 소형 매장 판매를 통해 가격 경쟁력을 유지하면서 고부가가치 상품을 적절히 배치한다면 매출을 더욱 늘릴 수 있을 것이다.", "link": "https://blog.naver.com/ranto28/223775063362"}, {"title": "우크라이나 전쟁 후 LNG 시장에서 한국 조선업의 경쟁력은?", "date": "2025-02-25", "folder": "에너지·자원", "tags": ["#LNG운반선", "#조선업", "#천연가스", "#미국-이스라엘"], "intro": "2025년 2월 기준으로 천연가스 공급 구조가 변화하면서 LNG 운반선의 수요가 급증하고 있다. 우크라이나 전쟁이 촉발한 이러한 변화는 한국 조선업에 어떤 영향이 있을까?", "question": "우크라이나 전쟁의 여파로 LNG 시장에 생긴 변동성이 한국 조선업의 기회를 만들 수 있을까?", "answer": "상황적으로 한국 조선업의 경쟁력이 강화될 가능성이 있다. 중국산 선박에 대한 신뢰가 낮아지고 있으며, 기술력과 안전성을 바탕으로 시장에서 우위를 점할 여지가 크다.", "link": "https://blog.naver.com/ranto28/223771847550"}, {"title": "LNG운반선만으론 안벽이 막힌다 — USTR 규제가 컨테이너선 수주 공백을 채운다", "date": "2025-02-25", "folder": "중후장대", "tags": ["#LNG운반선", "#안벽회전율", "#후동중화", "#USTR", "#SDN리스트", "#컨테이너선수주"], "intro": "25년 2월, USTR 보고서 2편. 한국 조선사가 LNG운반선에서 중국을 따돌리는 구조를 설명하면서, 동시에 LNG운반선만 수주하면 안벽 효율이 낮아진다는 구조적 문제를 짚는다. USTR의 중국 컨테이너선 규제가 이 공백을 채울 수 있다는 흐름이다.", "question": "LNG운반선 중심의 수주 구조가 한국 조선소의 안벽 효율을 제한하고 있는데, USTR 중국선박 규제가 이 문제를 실질적으로 해결해 주는가?", "answer": "해결해 준다. 조선사가 최대 수익을 내려면 LNG운반선과 컨테이너선·탱커의 혼재 수주가 필요하다. USTR 규제로 중국산 컨테이너선 발주 수요가 한국으로 전환되면 LNG운반선 수주잔고에서 비어 있던 컨테이너·탱커 안벽이 채워지는 구조다. LNG운반선 역량과 규제 수혜가 맞물리는 시점이다.", "link": "https://blog.naver.com/ranto28/223771815011"}, {"title": "트럼프가 우크라이나에 희토류를 원한다 — 안전을 위한 땅 확보의 메시지", "date": "2025-02-24", "folder": "미국·글로벌", "tags": ["#트럼프", "#우크라이나", "#희토류", "#국가안보"], "intro": "25년 2월 기준, 트럼프의 우크라이나 희토류 요구는 단순한 자원 확보가 아니라 미국의 전략적 안보와 연관된다. 한 국가의 희토류 절반을 요구하는 발언은 그 자체로 무리하게 들리지만, 이면에는 중대한 의미가 숨겨져 있다.", "question": "트럼프가 원하는 우크라이나의 희토류는 단순한 자원 확보가 아닌, 어떤 전       <div class="q-text">${d.question}</div>
    </div>
    <div class="answer-box" style="margin-top:8px">
      <div class="a-label">나의 답</div>
      <div class="a-text">${d.answer}</div>
    </div>
    ${d.link ? `<div class="source-link" style="margin-top:12px"><a href="${d.link}" target="_blank">원문 보기 →</a></div>` : ''}
  </div>
</div>`).join('');
    resultCount.textContent = items.length + '개';
}

function applySearch() {
    const q = searchQ.trim().toLowerCase();
    let filtered = allData;
    if (q) {
        filtered = allData.filter(d =>
            d.title.toLowerCase().includes(q) ||
            d.tags.join(' ').toLowerCase().includes(q) ||
            d.intro.toLowerCase().includes(q)
        );
    }
    renderCards(filtered);
}

document.getElementById('btnAll').addEventListener('click', () => {
    view = 'all';
    folderSection.style.display = 'none';
    allSection.style.display = 'block';
    document.getElementById('btnAll').classList.add('active');
    document.getElementById('btnFolders').classList.remove('active');
    applySearch();
});

document.getElementById('btnFolders').addEventListener('click', () => {
    view = 'folders';
    folderSection.style.display = 'block';
    allSection.style.display = 'none';
    document.getElementById('btnFolders').classList.add('active');
    document.getElementById('btnAll').classList.remove('active');
});

searchInput.addEventListener('input', e => {
    searchQ = e.target.value;
    if (view === 'folders' && searchQ.trim()) {
        // 검색 입력 시 자동으로 전체 보기로 전환
        document.getElementById('btnAll').click();
    } else if (view === 'all') {
        applySearch();
    }
});
</script>
</body>
</html>
